services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: p3
      POSTGRES_USER: p3
      POSTGRES_PASSWORD: p3
    ports:
      - "5432:5432"
    volumes:
      - p3-postgres-data:/var/lib/postgresql/data
      - ./db/certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./db/certs/server.key:/var/lib/postgresql/server.key:ro
    # TLS in transit only, per spec FR-010 — no at-rest encryption configured.
    # Run db/certs/generate-dev-cert.sh once before `docker compose up` to
    # create server.crt/server.key.
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p3 -d p3"]
      interval: 5s
      timeout: 5s
      retries: 10

# The JavaFX desktop application itself runs natively on the developer's
# machine (it needs a display, which a container doesn't have) — only
# PostgreSQL is containerized. Point the app at it with:
#   DATABASE_URL=jdbc:postgresql://localhost:5432/p3?sslmode=require
#   DATABASE_USER=p3
#   DATABASE_PASSWORD=p3
# See quickstart.md for the full local setup sequence.

volumes:
  p3-postgres-data:
